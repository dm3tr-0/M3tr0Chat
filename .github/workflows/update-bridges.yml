name: Update Tor Bridges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get and update bridges
        run: |
          curl -s "https://bridges.torproject.org/bridges/en?transport=obfs4" > page.html
          grep -oP 'obfs4\s+\d+\.\d+\.\d+\.\d+:\d+\s+[A-F0-9]+\s+cert=[^"\s<]+' page.html | \
            sed 's/&#43;/+/g' | \
            sed 's/&amp;/\&/g' > bridges.txt
          
          python3 << 'PYTHON'
          from datetime import datetime
          
          # Читаем мосты
          with open('bridges.txt', 'r') as f:
              bridges = f.read().strip()
          
          # Формируем блок
          date = datetime.now().strftime('%d.%m.%Y')
          new_block = f'''<!-- START_BRIDGES -->
          ## 🌉 Актуальные мосты Tor (obfs4)
          
          *Авто-обновление: каждый день в 00:00 UTC*
          
          ```bash
          {bridges}
