name: Update Tor Bridges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get bridges
        run: |
          curl -s "https://bridges.torproject.org/bridges/en?transport=obfs4" > page.html
          grep -o 'obfs4 [^<]*' page.html | head -2 | sed 's/&#43;/+/g' > bridges.txt
          
          if [ -s bridges.txt ]; then
            echo "BRIDGES_FOUND=true" >> $GITHUB_ENV
            echo "BRIDGES=$(cat bridges.txt)" >> $GITHUB_ENV
          else
            echo "BRIDGES_FOUND=false" >> $GITHUB_ENV
          fi
      
      - name: Update README
        if: env.BRIDGES_FOUND == 'true'
        run: |
          DATE=$(date '+%d.%m.%Y')
          
          cat > new_bridges.md << EOF
          ## 🌉 Tor Bridges (obfs4)
          
          *Updated: $DATE*
          
          \`\`\`
          ${{ env.BRIDGES }}
          \`\`\`
          
          ---
          EOF
          
          if grep -q "## 🌉 Tor Bridges" README.md; then
            sed -i '/## 🌉 Tor Bridges/,/---/c\\' README.md
          fi
          
          cat new_bridges.md >> README.md
          
      - name: Commit
        if: env.BRIDGES_FOUND == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update bridges ${{ env.BRIDGES }}"
          git push
