name: Update Tor Bridges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get bridges
        run: |
          curl -s "https://bridges.torproject.org/bridges/en?transport=obfs4" > page.html
          grep -oP 'obfs4\s+\d+\.\d+\.\d+\.\d+:\d+\s+[A-F0-9]+\s+cert=[^"\s<]+' page.html | \
            sed 's/&#43;/+/g' | \
            sed 's/&amp;/\&/g' > bridges.txt
          
          COUNT=$(wc -l < bridges.txt)
          echo "Найдено мостов: $COUNT"
          cat bridges.txt
          
          if [ "$COUNT" -gt 0 ]; then
            echo "BRIDGES_FOUND=true" >> $GITHUB_ENV
          else
            echo "BRIDGES_FOUND=false" >> $GITHUB_ENV
          fi
      
      - name: Update README
        if: env.BRIDGES_FOUND == 'true'
        run: |
          DATE=$(date '+%d.%m.%Y')
          
          # Читаем мосты
          BRIDGES_CONTENT=$(cat bridges.txt)
          
          # Создаем новый блок
          cat > new_block.md << EOF
          <!-- START_BRIDGES -->
          \`\`\`bash
          $BRIDGES_CONTENT
          \`\`\`
          **📅 Последнее обновление:** $DATE
          ---
          <!-- END_BRIDGES -->
          EOF
          
          # Проверяем, есть ли маркеры в README
          if grep -q "<!-- START_BRIDGES -->" README.md; then
            # Удаляем строки между маркерами и вставляем новый блок
            sed -i '/<!-- START_BRIDGES -->/,/<!-- END_BRIDGES -->/d' README.md
            sed -i '/<!-- START_BRIDGES -->/r new_block.md' README.md
          else
            # Добавляем после логотипа
            sed -i '/tor_logo.png?width=48) /r new_block.md' README.md
          fi
          
          echo "✅ README обновлен"
      
      - name: Commit and push
        if: env.BRIDGES_FOUND == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "🔄 Auto-update Tor bridges ($(date '+%d.%m.%Y %H:%M'))"
          git push
